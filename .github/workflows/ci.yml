name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        # Real Postgres and Redis for the integration tests.
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: tasktide
                    POSTGRES_PASSWORD: tasktide
                    POSTGRES_DB: tasktide
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U tasktide"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            redis:
                image: redis:8-alpine
                ports: ['6379:6379']
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DB_HOST: localhost
            DB_PORT: 5432
            DB_USER: tasktide
            DB_PASSWORD: tasktide
            DB_NAME: tasktide
            REDIS_URL: redis://localhost:6379
            SUPER_ADMIN_EMAIL: admin@example.dev
            SUPER_ADMIN_PASSWORD: ci-only-password

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
