services:
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: ${DB_USER:-tasktide}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-tasktide}
            POSTGRES_DB: ${DB_NAME:-tasktide}
        ports:
            - '5434:5432'
        volumes:
            - tasktide_db_data:/var/lib/postgresql/data
            - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
    tasktide_db_data:
